name: ci

# Verificación completa en macOS (el sidecar Swift y el audio solo compilan allí).
# Solo en pull requests y a mano: los minutos de macOS son caros en repos privados.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # scripts/guards.sh usa ripgrep.
      - name: Herramientas
        run: brew install ripgrep

      - name: Verificar (guards, cargo, clippy, tests, swift build, tsc, vitest)
        run: scripts/verify.sh

  # Windows: mismo contrato de verificación, sin `swift build` (el sidecar Swift
  # solo existe en macOS). Equivalente a scripts/verify.sh vía scripts/verify.ps1.
  # El estado de partida está medido en docs/win-baseline.md.
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    # No bloquea merges mientras el port madura (condición del mantenedor).
    # Se hará obligatorio cuando el audio esté y la suite sea estable aquí.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # scripts/guards.sh corre con el Git Bash del runner y necesita ripgrep;
      # chocolatey deja `rg` en el PATH de la máquina.
      - name: Herramientas
        shell: pwsh
        run: |
          choco install ripgrep -y --no-progress
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verificar (guards, cargo, clippy, tests, tsc, vitest; sin swift build)
        shell: pwsh
        run: ./scripts/verify.ps1
